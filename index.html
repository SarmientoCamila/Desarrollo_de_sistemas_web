<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Wars</title>

</head>
<body>
  <header>
    <img src="img/icon.png"alt="Star Wars Logo">
  </header>
  <nav>
    <a href="#index.html">Home</a>
    <a href="#charters.html">Personajes</a>
    <a href="#videos.html">Videos</a>
    <a href="#series.html">Series</a>
  </nav>
  <main>
    <div class="carousel">
      <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
      <div class="carousel-images" id="carousel">
        <img src="img/image.png" alt="Imagen 1">
        <img src="img/image_c671e2ee.jpeg" alt="Imagen 2">
        <img src="img/Star-Wars.jpg" alt="Imagen 3">
      </div>
      <button class="next" onclick="moveSlide(1)">&#10095;</button>
    </div>
  </main>
  <footer>
    <p>Síguenos en:</p>
    <a href="https://www.facebook.com/StarWars/" target="_blank">Facebook</a>
    <a href="https://twitter.com/starwars" target="_blank">Twitter</a>
    <a href="https://www.instagram.com/starwars/" target="_blank">Instagram</a>
    <a href="https://www.youtube.com/user/starwars" target="_blank">YouTube</a>
  </footer>
  <script>
    let index = 0;
    function moveSlide(step) {
      const carousel = document.getElementById('carousel');
      const totalSlides = carousel.children.length;
      index = (index + step + totalSlides) % totalSlides;
      carousel.style.transform = `translateX(-${index * 100}%)`;
    }
  </script>
</body>
</html>
